<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#faf9fc;--card:#fff;--tx:#14121a;--mut:#6d687b;--pu:#8b5cf6;--pl:#ede7fd;--bd:#e7e3f0;--er:#dc2626}
[data-theme=dark]{--bg:#0c0b10;--card:#17151e;--tx:#f4f2fa;--mut:#9a95aa;--pl:#2a2145;--bd:#2a2636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 90px}.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit;color:var(--tx)}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:4px 0}
button{background:var(--pu);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}button.g{background:var(--pl);color:var(--pu)}button.x{background:none;color:var(--er)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}.mut{color:var(--mut);font-size:14px}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#14121a,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:8px}nav button{flex:1;background:none;color:var(--mut)}nav .on{color:var(--pu);font-weight:700}
.b{padding:8px 12px;border-radius:14px;margin:6px 0;max-width:88%;white-space:pre-wrap}.u{background:var(--pu);color:#fff;margin-left:auto}.a{background:var(--pl)}
.msg{padding:10px;border-radius:12px;margin:8px 0}.e{background:#fee2e2;color:#991b1b}.s{background:#dcfce7;color:#166534}.bar{height:6px;background:var(--pl);border-radius:6px}.bar i{display:block;height:100%;border-radius:6px;background:var(--pu)}
</style></head><body><div id="app">Loading…</div><nav id="nav" hidden></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let OUT='',KIND='',SAVED=[],PF='all',sb,session,view='welcome',tab='home',msg=null,conv=null,profile={};
const note=(t,k='e')=>{msg={t,k};draw()};
const friendly=m=>/invalid login/i.test(m)?'Incorrect email or password.':/not confirmed/i.test(m)?'Please verify your email first. Check your inbox.':/fetch|network/i.test(m)?'Connection problem. Check your internet.':m||'Something went wrong.';
async function api(p,o={}){try{const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error);return j}catch(e){throw new Error(/fetch/i.test(e.message)?'Connection problem. Check your internet.':e.message||'Something went wrong.')}}
const db=(t)=>sb.from(t);
(async()=>{const c=await(await fetch('/api/config')).json();sb=supabase.createClient(c.url,c.anon);
 sb.auth.onAuthStateChange(async(ev,s)=>{session=s;if(ev==='PASSWORD_RECOVERY'){view='reset'}else if(s){const{data}=await db('profiles').select('*').single();profile=data||{};document.documentElement.dataset.theme=profile.theme||'light';view=profile.onboarded?'app':'onboard'}else{view=['login','signup','forgot'].includes(view)?view:'welcome'}draw()})})().catch(()=>{$('#app').textContent='Cannot reach the server.'});
const str=p=>{let n=0;if(p.length>=8)n++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))n++;if(/\d/.test(p))n++;if(/[^A-Za-z0-9]/.test(p))n++;return n};
const v=id=>($('#'+id)||{}).value||'';
const M=()=>msg?`<div class="msg ${msg.k}">${esc(msg.t)}</div>`:'';
const pw=(id,l)=>`<label class="mut">${l}</label><div class="row"><input id="${id}" type="password" autocomplete="${id==='pw'?'current-password':'new-password'}"><button class="g" data-a="eye" data-id="${id}">Show</button></div>`;
const AUTH={
welcome:()=>`<div style="text-align:center;margin-top:10vh"><div class="logo">N</div><h1>NOVA AI</h1><b>Your Life. Smarter with AI.</b><p class="mut">Your private AI workspace for chatting, planning and notes.</p><button data-a="v" data-id="signup">Get Started</button> <button class="g" data-a="v" data-id="login">Login</button> <button class="g" data-a="v" data-id="signup">Sign Up</button><p class="mut">Privacy Policy · Terms and Conditions (add your own pages)</p></div>`,
signup:()=>`<h1>Create account</h1>${M()}<div class="card"><input id="fn" placeholder="Full name"><input id="em" type="email" placeholder="Email">${pw('pw','Password')}<div class="bar"><i id="st" style="width:0"></i></div>${pw('pw2','Confirm password')}<label class="mut"><input id="tc" type="checkbox" style="width:auto"> I accept the Terms and Privacy Policy</label><br><button data-a="signup">Create Account</button> <button class="g" data-a="google">Google</button></div><button class="g" data-a="v" data-id="login">I already have an account</button>`,
login:()=>`<h1>Welcome back</h1>${M()}<div class="card"><input id="em" type="email" placeholder="Email">${pw('pw','Password')}<button data-a="login">Login</button> <button class="g" data-a="google">Google</button><p><a href="#" data-a="v" data-id="forgot">Forgot password?</a> · <a href="#" data-a="v" data-id="signup">Create new account</a></p></div>`,
forgot:()=>`<h1>Reset password</h1>${M()}<div class="card"><input id="em" type="email" placeholder="Registered email"><button data-a="forgot">Send reset link</button></div><button class="g" data-a="v" data-id="login">Return to Login</button>`,
reset:()=>`<h1>New password</h1>${M()}<div class="card">${pw('pw','New password')}${pw('pw2','Confirm new password')}<button data-a="reset">Save password</button></div>`,
onboard:()=>`<h1>Welcome${profile.full_name?', '+esc(profile.full_name.split(' ')[0]):''}</h1><div class="card"><input id="ob_n" placeholder="Your name" value="${esc(profile.full_name||'')}"><select id="ob_l"><option>English</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option></select><select id="ob_t"><option value="light">Light</option><option value="dark">Dark</option></select><div class="row"><button data-a="onb">Finish</button><button class="g" data-a="onb" data-id="skip">Skip</button></div></div>`};
async function load(){const q=(t,o,a=false)=>db(t).select('*').order(o,{ascending:a});const[t,n,c,g,r,sv]=await Promise.all([q('tasks','created_at'),q('notes','updated_at'),q('conversations','updated_at'),q('goals','created_at'),q('reminders','remind_at',true),q('saved_content','created_at')]);SAVED=sv.data||[];return{t:t.data||[],n:n.data||[],c:c.data||[],g:g.data||[],r:r.data||[],s:SAVED}}
async function draw(){
 const nav=$('#nav');nav.hidden=view!=='app';
 if(view!=='app'){$('#app').innerHTML=AUTH[view]();return}
 nav.innerHTML=[['home','Home'],['chat','Assistant'],['tasks','Planner'],['notes','Notes'],['me','Profile']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('');
 const d=await load();let h=M();

 const tl=[['write','Write'],['content','Content'],['goals','Goals'],['rem','Reminders'],['stats','Analytics'],['help','Help']];
 const bk=`<button class="g" data-a="tab" data-id="home">← Home</button>`;
 const op=a=>a.map(x=>`<option>${x}</option>`).join('');
 const oc=()=>OUT?`<div class="card"><div style="white-space:pre-wrap">${esc(OUT)}</div><div class="row"><button class="g" data-a="cpo">Copy</button><button data-a="svo">Save</button></div></div>`:'';
 const sv=()=>`<h2>Saved</h2>${d.s.map(x=>`<div class="card"><b>${esc(x.kind)}</b><div style="white-space:pre-wrap;max-height:120px;overflow:auto">${esc(x.content)}</div><div class="row"><button class="g" data-a="cps" data-id="${x.id}">Copy</button><button class="x" data-a="dls" data-id="${x.id}">Delete</button></div></div>`).join('')||'<p class="mut">Nothing saved yet.</p>'}`;
 if(tab==='home'){const dn=d.t.filter(t=>t.done).length,pc=d.t.length?Math.round(dn/d.t.length*100):0,hr=new Date().getHours(),due=d.r.filter(r=>!r.done&&new Date(r.remind_at)<=new Date());
  h+=`<div class="row"><div class="logo" style="flex:0 0 40px;width:40px;height:40px;font-size:20px;margin:0">N</div><div><b>NOVA AI</b><div class="mut">Your Life. Smarter with AI.</div></div></div><h1>Good ${hr<12?'morning':hr<18?'afternoon':'evening'}, ${esc((profile.full_name||'there').split(' ')[0])}</h1><div class="mut">${new Date().toLocaleDateString(undefined,{dateStyle:'full'})}</div>${due.length?`<div class="card"><b>🔔 ${due.length} reminder(s) due</b>${due.map(r=>`<div class="mut">${esc(r.title)}</div>`).join('')}</div>`:''}<div class="card"><div class="row"><input id="hq" placeholder="Ask NOVA anything…"><button data-a="hask">Ask</button></div></div><div class="row" style="flex-wrap:wrap">${tl.map(([k,l])=>`<button class="g" data-a="tab" data-id="${k}">${l}</button>`).join('')}<button class="g" data-a="tab" data-id="tasks">New task</button><button class="g" data-a="newn2">New note</button></div><div class="card"><b>Progress</b><div class="mut">${dn} of ${d.t.length} tasks done</div><div class="bar"><i style="width:${pc}%"></i></div></div><h2>Recent notes</h2>${d.n.slice(0,3).map(n=>`<div class="card">${esc(n.title||'Untitled')}</div>`).join('')||'<p class="mut">None yet.</p>'}<h2>Recent conversations</h2>${d.c.slice(0,3).map(c=>`<div class="card" data-a="openc2" data-id="${c.id}" style="cursor:pointer">${esc(c.title)}</div>`).join('')||'<p class="mut">None yet.</p>'}`}
 if(tab==='write')h+=`${bk}<h1>Writing</h1><div class="card"><select id="wc">${op(['Professional email','Business proposal','Social media caption','Blog post','Marketing content','Product description','Business message','Creative writing','Professional biography','Advertisement'])}</select><div class="row"><select id="wt">${op(['Professional','Friendly','Persuasive','Casual','Formal'])}</select><select id="wl">${op(['Short','Medium','Long'])}</select></div><div class="row"><input id="ws" placeholder="Style (e.g. witty)"><input id="wa" placeholder="Audience"></div><textarea id="wi" rows="4" placeholder="Describe what to write, or paste text"></textarea><div class="row" style="flex-wrap:wrap">${['Generate','Rewrite','Improve','Summarise'].map(m=>`<button class="${m==='Generate'?'':'g'}" data-a="gen" data-id="${m}">${m}</button>`).join('')}</div></div><div id="out">${oc()}</div>${sv()}`;
 if(tab==='content')h+=`${bk}<h1>Content Creator</h1><div class="card"><select id="cc">${op(['Instagram content ideas','Pinterest pin descriptions','YouTube video ideas','Blog topics','Business content ideas','Marketing campaign','Hashtag suggestions','7-day social media calendar','Product promotion ideas'])}</select><input id="ci" placeholder="Topic, niche or product"><button data-a="gen" data-id="c">Generate</button></div><div id="out">${oc()}</div>${sv()}`;
 if(tab==='goals')h+=`${bk}<h1>Goals</h1><div class="card"><input id="gt" placeholder="New goal"><div class="row"><select id="gk"><option>Personal</option><option>Professional</option></select><input id="gd" type="date"></div><input id="gx" placeholder="Description"><button data-a="addg">Add goal</button></div><p class="mut">${d.g.filter(g=>g.progress>=100).length} completed · ${d.g.filter(g=>g.progress<100).length} pending</p>${d.g.map(g=>`<div class="card"><div class="row"><b>${g.progress>=100?'✅ ':''}${esc(g.title)}</b><button class="x" data-a="delg" data-id="${g.id}">✕</button></div><div class="mut">${esc(g.kind||'')} ${g.due?'· due '+g.due:''} ${esc(g.description||'')}</div><div class="bar"><i style="width:${g.progress}%"></i></div><input type="range" min="0" max="100" step="5" value="${g.progress}" data-g="${g.id}"><div class="mut">${g.progress}%</div></div>`).join('')||'<p class="mut">No goals yet.</p>'}`;
 if(tab==='rem')h+=`${bk}<h1>Reminders</h1><div class="card"><input id="rt" placeholder="Remind me to…"><div class="row"><input id="rd" type="date"><input id="rm" type="time"></div><div class="row"><select id="rc">${op(['General','Work','Health','Personal'])}</select><button data-a="addr">Add</button></div><button class="g" data-a="notif">Enable browser notifications</button></div>${d.r.map(r=>`<div class="card row"><input type="checkbox" style="width:22px;flex:0 0 22px" ${r.done?'checked':''} data-a="togr" data-id="${r.id}"><span style="${r.done?'text-decoration:line-through':''}">${esc(r.title)}<div class="mut">${esc(r.category||'')} · ${new Date(r.remind_at).toLocaleString()}</div></span><button class="x" data-a="delr" data-id="${r.id}">✕</button></div>`).join('')||'<p class="mut">No reminders yet.</p>'}`;
 if(tab==='stats'){const dn=d.t.filter(t=>t.done).length,days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=x.toISOString().slice(0,10);return[k,d.t.filter(t=>t.done_at&&t.done_at.slice(0,10)===k).length]}),mx=Math.max(1,...days.map(x=>x[1])),m30=new Date(Date.now()-30*864e5).toISOString();
  h+=`${bk}<h1>Analytics</h1><div class="row"><div class="card"><b>${d.t.length}</b><div class="mut">Total</div></div><div class="card"><b>${dn}</b><div class="mut">Done</div></div><div class="card"><b>${d.t.length-dn}</b><div class="mut">Pending</div></div></div><div class="card"><b>Completed per day</b>${days.map(([k,n])=>`<div class="row"><span class="mut" style="flex:0 0 50px">${k.slice(5)}</span><div class="bar"><i style="width:${n/mx*100}%"></i></div><span style="flex:0 0 20px">${n}</span></div>`).join('')}<div class="mut">Last 30 days: ${d.t.filter(t=>t.done_at&&t.done_at>m30).length} tasks · Goals completed: ${d.g.filter(g=>g.progress>=100).length}/${d.g.length}</div></div>`}
 if(tab==='help')h+=`${bk}<h1>Help &amp; Support</h1><div class="card"><details><summary><b>Where is my data?</b></summary><p class="mut">In your private database. Only you can read it.</p></details><details><summary><b>How do I delete my account?</b></summary><p class="mut">Profile, then Delete account.</p></details><details><summary><b>Is there a paid plan?</b></summary><p class="mut">Pro is coming soon. No payments are collected yet.</p></details></div><div class="card"><b>Feedback or problem</b><select id="hs">${op(['Feedback','Report a problem','Support request'])}</select><textarea id="hm" rows="3" placeholder="Tell us more"></textarea><button data-a="fb">Send</button></div>`;
 if(tab==='terms')h+=`${bk}<h1>Terms and Conditions</h1><div class="card mut">NOVA AI is provided as is. AI replies can be wrong, so check anything important. You can delete your account and data at any time. This is a starter text: have a lawyer review it before launch.</div>`;
 if(tab==='privacy')h+=`${bk}<h1>Privacy Policy</h1><div class="card mut">Your data is stored in a private database that only you can access. Text you send to the AI is processed by OpenAI to produce replies. You can delete all your data by deleting your account. This is a starter text: have a lawyer review it before launch.</div>`;
 if(tab==='plans')h+=`${bk}<h1>Plans</h1><div class="card"><b>Free (current)</b><div class="mut">20 AI messages a day, planner, notes, goals, reminders, writing tools.</div></div><div class="card"><b>NOVA Pro (coming soon)</b><div class="mut">200 AI messages a day, more storage, advanced analytics.</div><button data-a="upg">Upgrade</button><div class="mut">No payments are collected until a payment gateway is connected and tested.</div></div>`;
 if(tab==='chat'){if(!conv)h+=`<h1>Assistant</h1><button data-a="newc">+ New conversation</button>${d.c.map(c=>`<div class="card row"><span data-a="openc" data-id="${c.id}" style="cursor:pointer">${esc(c.title)}</span><button class="g" data-a="renc" data-id="${c.id}">Rename</button><button class="x" data-a="delc" data-id="${c.id}">Delete</button></div>`).join('')||'<p class="mut">No conversations yet.</p>'}`;
  else{const{data:ms}=await db('messages').select('*').eq('conversation_id',conv).order('created_at');h+=`<button class="g" data-a="backc">← All</button><div id="log">${(ms||[]).map(m=>`<div class="b ${m.role==='user'?'u':'a'}">${esc(m.content)}</div><div class="mut">${new Date(m.created_at).toLocaleTimeString()}</div>`).join('')}</div><div class="row"><textarea id="in" rows="2" placeholder="Message NOVA…"></textarea><button data-a="send">Send</button></div>`}}
 if(tab==='tasks')h+=`<h1>Planner</h1><div class="row" style="flex-wrap:wrap">${[['all','All'],['day','Today'],['week','Week'],['month','Month'],['over','Overdue']].map(([k,l])=>`<button class="${PF===k?'':'g'}" data-a="pf" data-id="${k}">${l}</button>`).join('')}</div><div class="card"><input id="tt" placeholder="New task"><div class="row"><input id="td" type="date"><select id="tp"><option>Medium</option><option>High</option><option>Low</option></select><button data-a="addt">Add</button></div></div>${d.t.filter(pff).map(t=>`<div class="card row"><input type="checkbox" style="width:22px;flex:0 0 22px" ${t.done?'checked':''} data-a="tog" data-id="${t.id}"><span style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}<div class="mut">${t.due||''} ${!t.done&&t.due&&t.due<new Date().toISOString().slice(0,10)?'· Overdue':''}</div></span><button class="x" data-a="delt" data-id="${t.id}">✕</button></div>`).join('')||'<p class="mut">No tasks yet.</p>'}`;
 if(tab==='notes')h+=`<div class="row"><h1>Notes</h1><button data-a="newn">+ New</button></div><input id="nq" placeholder="Search notes">${[...d.n].sort((a,b)=>b.pinned-a.pinned).map(n=>`<div class="card" data-s="${esc((n.title+' '+n.body+' '+(n.folder||'')).toLowerCase())}"><input data-n="${n.id}" data-f="title" value="${esc(n.title)}" placeholder="Title"><textarea data-n="${n.id}" data-f="body" rows="4">${esc(n.body)}</textarea><input data-n="${n.id}" data-f="folder" value="${esc(n.folder||'')}" placeholder="Folder"><div class="row" style="flex-wrap:wrap"><button class="g" data-a="pin" data-id="${n.id}">${n.pinned?'Unpin':'Pin'}</button><button class="g" data-a="sumn" data-id="${n.id}">AI summary</button><button class="g" data-a="cpn" data-id="${n.id}">Copy</button><button class="x" data-a="deln" data-id="${n.id}">Delete</button></div><div class="mut" id="sm${n.id}"></div></div>`).join('')||'<p class="mut">No notes yet.</p>'}`;
 if(tab==='me')h+=`<h1>Profile</h1><div class="card"><b>${esc(profile.full_name||'')}</b><div class="mut">${esc(session.user.email)} · member since ${new Date(session.user.created_at).toLocaleDateString()} · plan: ${esc(profile.plan||'free')}</div><button class="g" data-a="theme">Toggle light/dark</button><select id="pl">${op(['English','Spanish','French','German','Arabic'].map(l=>l))}</select><label class="mut"><input type="checkbox" style="width:auto" data-a="nt2" ${profile.notif!==false?'checked':''}> Reminder notifications</label><div class="row" style="flex-wrap:wrap"><button class="g" data-a="tab" data-id="plans">Plans</button><button class="g" data-a="tab" data-id="help">Help</button><button class="g" data-a="tab" data-id="terms">Terms</button><button class="g" data-a="tab" data-id="privacy">Privacy</button></div></div><div class="card"><b>Change password</b>${pw('pw','New password')}${pw('pw2','Confirm')}<button data-a="reset">Update</button></div><button data-a="logout">Log out</button> <button class="x" data-a="delacc">Delete account</button>`;
 $('#app').innerHTML=h;msg=null}
const go=async(f)=>{try{await f()}catch(e){note(friendly(e.message))}};
const A={
v(id){view=id;msg=null;draw()},eye(id){const i=$('#'+id);i.type=i.type==='password'?'text':'password'},
signup:()=>go(async()=>{const e=v('em').trim(),p=v('pw');if(!v('fn').trim()||!e||!p)return note('Please fill in all fields.');if(!/^\S+@\S+\.\S+$/.test(e))return note('Enter a valid email address.');if(p.length<8)return note('Password needs at least 8 characters.');if(p!==v('pw2'))return note('Passwords do not match.');if(!$('#tc').checked)return note('Please accept the Terms and Privacy Policy.');
  const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:v('fn').trim()},emailRedirectTo:location.origin}});if(error)throw error;
  if(data.user&&data.user.identities&&!data.user.identities.length)return note('An account with this email already exists. Try logging in.');
  view='login';note('Account created. Check your email and click the verification link, then log in.','s')}),
login:()=>go(async()=>{if(!v('em')||!v('pw'))return note('Enter your email and password.');const{error}=await sb.auth.signInWithPassword({email:v('em').trim(),password:v('pw')});if(error)throw error}),
google:()=>go(async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});if(error)throw error}),
forgot:()=>go(async()=>{if(!/^\S+@\S+\.\S+$/.test(v('em')))return note('Enter a valid email address.');const{error}=await sb.auth.resetPasswordForEmail(v('em').trim(),{redirectTo:location.origin});if(error)throw error;note('If that email is registered, a reset link is on its way.','s')}),
reset:()=>go(async()=>{if(v('pw').length<8)return note('Password needs at least 8 characters.');if(v('pw')!==v('pw2'))return note('Passwords do not match.');const{error}=await sb.auth.updateUser({password:v('pw')});if(error)throw error;if(view==='reset'){view='app'}note('Password updated.','s')}),
onb:(id)=>go(async()=>{const u=id==='skip'?{onboarded:true}:{onboarded:true,full_name:v('ob_n'),lang:v('ob_l'),theme:v('ob_t')};await db('profiles').update(u).eq('id',session.user.id);Object.assign(profile,u);document.documentElement.dataset.theme=profile.theme||'light';view='app';draw()}),
tab(id){tab=id;conv=null;draw()},backc(){conv=null;draw()},openc(id){conv=id;draw()},
newc:()=>go(async()=>{const{data,error}=await db('conversations').insert({}).select().single();if(error)throw error;conv=data.id;draw()}),
renc:(id)=>go(async()=>{const t=prompt('Rename conversation');if(t)await db('conversations').update({title:t}).eq('id',id);draw()}),
delc:(id)=>go(async()=>{if(confirm('Delete this conversation?')){await db('conversations').delete().eq('id',id);draw()}}),
send:()=>go(async()=>{const m=v('in').trim();if(!m)return;$('#log').insertAdjacentHTML('beforeend',`<div class="b u">${esc(m)}</div><div class="b a">Thinking…</div>`);$('#in').value='';await api('/api/chat',{method:'POST',body:JSON.stringify({conversationId:conv,message:m})});draw()}),
addt:()=>go(async()=>{if(!v('tt').trim())return note('Enter a task title.');const{error}=await db('tasks').insert({title:v('tt').trim(),due:v('td')||null,priority:v('tp')});if(error)throw error;draw()}),
tog:(id)=>go(async()=>{const c=$(`[data-id="${id}"]`).checked;await db('tasks').update({done:c,done_at:c?new Date().toISOString():null}).eq('id',id);draw()}),
delt:(id)=>go(async()=>{await db('tasks').delete().eq('id',id);draw()}),
newn:()=>go(async()=>{await db('notes').insert({});draw()}),deln:(id)=>go(async()=>{if(confirm('Delete this note?')){await db('notes').delete().eq('id',id);draw()}}),
theme:()=>go(async()=>{const t=profile.theme==='dark'?'light':'dark';await db('profiles').update({theme:t}).eq('id',session.user.id);profile.theme=t;document.documentElement.dataset.theme=t}),
logout:()=>go(async()=>{if(confirm('Do you want to log out?')){await sb.auth.signOut();view='welcome';draw()}}),
delacc:()=>go(async()=>{if(confirm('Permanently delete your account and ALL data? This cannot be undone.')&&prompt('Type DELETE to confirm')==='DELETE'){await api('/api/account',{method:'DELETE'});await sb.auth.signOut();view='welcome';draw()}})};

const pff=t=>{const td=new Date().toISOString().slice(0,10),e=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);if(PF==='all')return true;if(!t.due)return false;if(PF==='day')return t.due===td;if(PF==='week')return t.due>=td&&t.due<=e(7);if(PF==='month')return t.due>=td&&t.due<=e(31);return !t.done&&t.due<td};
const cp=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('Copied')).catch(()=>alert('Copy was blocked by the browser.')):alert('Copy is not supported here.');
Object.assign(A,{
tab(id){tab=id;conv=null;OUT='';draw()},pf(id){PF=id;draw()},
openc2(id){tab='chat';conv=id;draw()},newn2:()=>go(async()=>{await db('notes').insert({});tab='notes';draw()}),
hask:()=>go(async()=>{const m=v('hq').trim();if(!m)return note('Type a question first.');const{data,error}=await db('conversations').insert({title:m.slice(0,40)}).select().single();if(error)throw error;tab='chat';conv=data.id;draw();await api('/api/chat',{method:'POST',body:JSON.stringify({conversationId:data.id,message:m})});draw()}),
gen:(m)=>go(async()=>{let p;if(tab==='write'){const i=v('wi').trim();if(!i)return note('Please enter some text or a brief.');KIND=v('wc');p=m+' this ('+KIND+'). Tone: '+v('wt')+'. Length: '+v('wl')+'. Style: '+(v('ws')||'natural')+'. Audience: '+(v('wa')||'general')+'.\n\n'+i+'\n\nReturn only the finished text.'}else{const i=v('ci').trim();if(!i)return note('Please enter a topic.');KIND=v('cc');p='Create: '+KIND+'. Topic or business: '+i+'. Be specific and ready to use.'}
  $('#out').innerHTML='<div class="card mut">Generating…</div>';try{const r=await api('/api/generate',{method:'POST',body:JSON.stringify({prompt:p})});OUT=r.text;$('#out').innerHTML=oc2()}catch(e){$('#out').innerHTML='';throw e}}),
cpo(){cp(OUT)},svo:()=>go(async()=>{const{error}=await db('saved_content').insert({kind:KIND,content:OUT});if(error)throw error;draw()}),
cps(id){const x=SAVED.find(y=>y.id===id);if(x)cp(x.content)},dls:(id)=>go(async()=>{await db('saved_content').delete().eq('id',id);draw()}),
addg:()=>go(async()=>{if(!v('gt').trim())return note('Please enter a goal.');const{error}=await db('goals').insert({title:v('gt').trim(),kind:v('gk'),due:v('gd')||null,description:v('gx')});if(error)throw error;draw()}),
delg:(id)=>go(async()=>{await db('goals').delete().eq('id',id);draw()}),
addr:()=>go(async()=>{if(!v('rt').trim()||!v('rd'))return note('Please enter a title and date.');const{error}=await db('reminders').insert({title:v('rt').trim(),remind_at:new Date(v('rd')+'T'+(v('rm')||'09:00')).toISOString(),category:v('rc')});if(error)throw error;draw()}),
togr:(id)=>go(async()=>{await db('reminders').update({done:$('[data-id="'+id+'"]').checked}).eq('id',id);draw()}),delr:(id)=>go(async()=>{await db('reminders').delete().eq('id',id);draw()}),
notif:()=>go(async()=>{if(!window.Notification)return note('This browser does not support notifications. In-app reminders still work.');const p=await Notification.requestPermission();note(p==='granted'?'Notifications enabled.':'Notifications are off. In-app reminders still work.',p==='granted'?'s':'e')}),
pin:(id)=>go(async()=>{const n=(await db('notes').select('pinned').eq('id',id).single()).data;await db('notes').update({pinned:!n.pinned}).eq('id',id);draw()}),
cpn(id){const t=document.querySelectorAll('[data-n="'+id+'"]');cp(Array.from(t).map(x=>x.value).join('\n\n'))},
sumn:(id)=>go(async()=>{const b=($('textarea[data-n="'+id+'"]')||{}).value||'';if(!b.trim())return note('Write something first.');const el=$('#sm'+id);el.textContent='Summarising…';try{const r=await api('/api/generate',{method:'POST',body:JSON.stringify({prompt:'Summarise this note in 2-3 sentences:\n\n'+b})});el.textContent=r.text}catch(e){el.textContent='';throw e}}),
fb:()=>go(async()=>{if(!v('hm').trim())return note('Please write a message first.');const{error}=await db('feedback').insert({type:v('hs'),message:v('hm').trim()});if(error)throw error;note('Thank you! Your message was saved.','s')}),
nt2:()=>go(async()=>{profile.notif=profile.notif===false;await db('profiles').update({notif:profile.notif}).eq('id',session.user.id)}),
upg(){note('NOVA Pro is not available yet. No payment has been taken.')}});
const oc2=()=>'<div class="card"><div style="white-space:pre-wrap">'+esc(OUT)+'</div><div class="row"><button class="g" data-a="cpo">Copy</button><button data-a="svo">Save</button></div></div>';
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.g)go(async()=>{await db('goals').update({progress:+t.value}).eq('id',t.dataset.g);draw()});if(t.id==='pl')db('profiles').update({lang:t.value}).eq('id',session.user.id)});
document.addEventListener('input',e=>{if(e.target.id==='nq'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-s]').forEach(c=>c.style.display=c.dataset.s.includes(q)?'':'none')}});
const told=new Set();setInterval(async()=>{try{if(view!=='app'||!window.Notification||Notification.permission!=='granted'||profile.notif===false)return;const{data}=await db('reminders').select('*').eq('done',false).lte('remind_at',new Date().toISOString());(data||[]).forEach(r=>{if(!told.has(r.id)){told.add(r.id);new Notification('NOVA AI',{body:r.title})}})}catch(e){}},30000);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.tagName==='A')e.preventDefault();A[b.dataset.a](b.dataset.id)}});
let tm;document.addEventListener('input',e=>{const t=e.target;if(t.id==='pw'&&$('#st'))$('#st').style.width=str(t.value)*25+'%';if(t.dataset.n){clearTimeout(tm);tm=setTimeout(()=>db('notes').update({[t.dataset.f]:t.value,updated_at:new Date().toISOString()}).eq('id',t.dataset.n),600)}});
